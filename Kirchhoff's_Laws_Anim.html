<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirchhoff's Laws: Two-Loop Circuit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        .math-font { font-family: 'Fira Code', monospace; }

        /* SVG Animations */
        .wire-draw {
            stroke-dasharray: 1500;
            stroke-dashoffset: 1500;
            transition: stroke-dashoffset 1.5s ease-in-out;
        }
        .wire-drawn { stroke-dashoffset: 0; }

        .flow-line {
            stroke-dasharray: 10 10;
            animation: flowAnim 0.8s linear infinite;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .flow-visible { opacity: 0.8; }
        
        @keyframes flowAnim {
            from { stroke-dashoffset: 20; }
            to { stroke-dashoffset: 0; }
        }

        .loop-glow {
            stroke-dasharray: 1600;
            stroke-dashoffset: 1600;
            opacity: 0;
        }
        .animate-loop-glow {
            animation: traceLoop 4s linear forwards;
            opacity: 0.5;
        }
        @keyframes traceLoop {
            0% { stroke-dashoffset: 1600; }
            100% { stroke-dashoffset: 0; }
        }

        .node-glow {
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes pulseGlow {
            from { filter: drop-shadow(0 0 4px rgba(250, 204, 21, 0.5)); r: 6; }
            to { filter: drop-shadow(0 0 12px rgba(250, 204, 21, 1)); r: 9; }
        }

        /* UI Transitions */
        .fade-enter { opacity: 0; transform: translateY(10px); transition: all 0.5s ease; }
        .fade-enter-active { opacity: 1; transform: translateY(0); }
        .fade-exit { opacity: 1; transition: all 0.3s ease; }
        .fade-exit-active { opacity: 0; }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col text-slate-800 overflow-hidden">

    <!-- Header -->
    <header class="bg-white shadow-sm py-4 px-6 z-10 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Kirchhoff's Laws</h1>
            <p class="text-sm text-slate-500">Interactive Circuit Analysis</p>
        </div>
        <div class="flex gap-2">
            <div class="w-3 h-3 rounded-full bg-slate-300" id="dot-1"></div>
            <div class="w-3 h-3 rounded-full bg-slate-300" id="dot-2"></div>
            <div class="w-3 h-3 rounded-full bg-slate-300" id="dot-3"></div>
            <div class="w-3 h-3 rounded-full bg-slate-300" id="dot-4"></div>
            <div class="w-3 h-3 rounded-full bg-slate-300" id="dot-5"></div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col md:flex-row p-4 gap-4 overflow-hidden">
        
        <!-- Canvas Area -->
        <div class="flex-1 bg-white rounded-xl shadow-md border border-slate-200 relative flex items-center justify-center overflow-hidden min-h-[400px]">
            <svg id="circuit-svg" viewBox="0 0 800 600" class="w-full h-full max-w-3xl">
                <!-- Defs & Filters -->
                <defs>
                    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="8" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
                    </marker>
                    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e" />
                    </marker>
                    <marker id="arrow-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="#a855f7" />
                    </marker>
                </defs>

                <!-- Glowing KVL Loops (Behind Wires) -->
                <!-- Loop 1 (Left, CW): 400,450 -> 150,450 -> 150,150 -> 400,150 -> 400,450 -->
                <path id="loop1-glow" d="M 400 450 L 150 450 L 150 150 L 400 150 L 400 450" 
                      fill="none" stroke="#ef4444" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" class="loop-glow" filter="url(#glow-filter)" />
                <!-- Loop 2 (Right, CW): 400,450 -> 400,150 -> 650,150 -> 650,450 -> 400,450 -->
                <path id="loop2-glow" d="M 400 450 L 400 150 L 650 150 L 650 450 Z" 
                      fill="none" stroke="#22c55e" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" class="loop-glow" filter="url(#glow-filter)" />

                <!-- Base Wires -->
                <!-- Left Branch -->
                <path id="wire-left" d="M 400 450 L 150 450 L 150 370 M 150 330 L 150 270 M 150 230 L 150 150 L 230 150 M 270 150 L 400 150" 
                      fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="wire-draw" />
                <!-- Middle Branch -->
                <path id="wire-mid" d="M 400 150 L 400 280 M 400 320 L 400 450" 
                      fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="wire-draw" />
                <!-- Right Branch -->
                <path id="wire-right" d="M 400 450 L 650 450 L 650 370 M 650 330 L 650 270 M 650 230 L 650 150 L 400 150" 
                      fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="wire-draw" />

                <!-- Current Flow Animations -->
                <!-- I1 (Up left branch): 400,450 -> 150,450 -> 150,150 -> 400,150 -->
                <path id="flow-i1" d="M 400 450 L 150 450 L 150 150 L 400 150" fill="none" stroke="#ef4444" stroke-width="4" class="flow-line" />
                <!-- I2 (Up right branch): 400,450 -> 650,450 -> 650,150 -> 400,150 -->
                <path id="flow-i2" d="M 400 450 L 650 450 L 650 150 L 400 150" fill="none" stroke="#22c55e" stroke-width="4" class="flow-line" />
                <!-- I3 (Down middle): 400,150 -> 400,450 -->
                <path id="flow-i3" d="M 400 150 L 400 450" fill="none" stroke="#a855f7" stroke-width="4" class="flow-line" />

                <!-- Components Group (fade in Phase 1) -->
                <g id="components" class="opacity-0 transition-opacity duration-1000">
                    
                    <!-- Left Branch: E1 (150,350), rw1 (150,250), R1 (250,150) -->
                    <g transform="translate(150, 350)">
                        <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#0ea5e9" stroke-width="3"/> <!-- Long (Positive) -->
                        <line x1="-12" y1="10" x2="12" y2="10" stroke="#0ea5e9" stroke-width="6"/> <!-- Short (Negative) -->
                        <text x="-40" y="5" font-size="18" fill="#0ea5e9" font-weight="bold" text-anchor="end">ε₁ = 4.5V</text>
                        <text x="-40" y="-15" font-size="24" fill="#0ea5e9" font-weight="bold" text-anchor="end">+</text>
                    </g>
                    
                    <g transform="translate(150, 250)">
                        <path d="M 0,20 L -10,15 L 10,5 L -10,-5 L 10,-15 L 0,-20" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linejoin="round"/>
                        <text x="-30" y="5" font-size="16" fill="#0ea5e9" text-anchor="end">r_w1 = 1Ω</text>
                    </g>

                    <g transform="translate(250, 150)">
                        <path d="M -20,0 L -15,-10 L -5,10 L 5,-10 L 15,10 L 20,0" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linejoin="round"/>
                        <text x="0" y="-20" font-size="18" fill="#0ea5e9" text-anchor="middle">R₁ = 20Ω</text>
                    </g>

                    <!-- Middle Branch: R2 (400,300) -->
                    <g transform="translate(400, 300)">
                        <path d="M 0,20 L -10,15 L 10,5 L -10,-5 L 10,-15 L 0,-20" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linejoin="round"/>
                        <text x="30" y="5" font-size="18" fill="#0ea5e9" text-anchor="start">R₂ = 10Ω</text>
                    </g>

                    <!-- Right Branch: E2 (650,350), rw2 (650,250) -->
                    <g transform="translate(650, 350)">
                        <line x1="-20" y1="-10" x2="20" y2="-10" stroke="#0ea5e9" stroke-width="3"/>
                        <line x1="-12" y1="10" x2="12" y2="10" stroke="#0ea5e9" stroke-width="6"/>
                        <text x="40" y="5" font-size="18" fill="#0ea5e9" font-weight="bold" text-anchor="start">ε₂ = 9V</text>
                        <text x="40" y="-15" font-size="24" fill="#0ea5e9" font-weight="bold" text-anchor="start">+</text>
                    </g>

                    <g transform="translate(650, 250)">
                        <path d="M 0,20 L -10,15 L 10,5 L -10,-5 L 10,-15 L 0,-20" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linejoin="round"/>
                        <text x="30" y="5" font-size="16" fill="#0ea5e9" text-anchor="start">r_w2 = 1Ω</text>
                    </g>
                </g>

                <!-- Static Current Arrow Overlays (Phase 2+) -->
                <g id="static-arrows" class="opacity-0 transition-opacity duration-700">
                    <!-- I1 Label near A -->
                    <g transform="translate(300, 150)">
                        <line x1="-20" y1="-15" x2="15" y2="-15" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow-red)"/>
                        <text x="0" y="-25" font-size="20" fill="#ef4444" font-weight="bold" text-anchor="middle">I₁</text>
                    </g>
                    <!-- I2 Label near A -->
                    <g transform="translate(500, 150)">
                        <line x1="20" y1="-15" x2="-15" y2="-15" stroke="#22c55e" stroke-width="3" marker-end="url(#arrow-green)"/>
                        <text x="0" y="-25" font-size="20" fill="#22c55e" font-weight="bold" text-anchor="middle">I₂</text>
                    </g>
                    <!-- I3 Label near A -->
                    <g transform="translate(400, 200)">
                        <line x1="20" y1="-20" x2="20" y2="15" stroke="#a855f7" stroke-width="3" marker-end="url(#arrow-purple)"/>
                        <text x="35" y="0" font-size="20" fill="#a855f7" font-weight="bold" text-anchor="start">I₃</text>
                    </g>
                </g>

                <!-- Nodes -->
                <g id="nodes" class="opacity-0 transition-opacity duration-1000">
                    <circle id="node-a" cx="400" cy="150" r="6" fill="#1e293b" class="transition-all duration-300" />
                    <text x="400" y="130" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">Node A</text>
                    
                    <circle id="node-b" cx="400" cy="450" r="6" fill="#1e293b" />
                    <text x="400" y="480" font-size="22" font-weight="bold" fill="#1e293b" text-anchor="middle">Node B</text>
                </g>

            </svg>
        </div>

        <!-- Info / Control Panel -->
        <div class="w-full md:w-[450px] bg-white rounded-xl shadow-md border border-slate-200 flex flex-col h-[500px] md:h-auto overflow-hidden">
            
            <div class="p-6 flex-1 overflow-y-auto relative" id="panel-content">
                <!-- Content injected via JS -->
            </div>

            <div class="bg-slate-50 border-t border-slate-200 p-4 flex justify-between items-center">
                <button id="btn-prev" class="px-4 py-2 rounded-lg text-slate-600 font-semibold hover:bg-slate-200 disabled:opacity-50 transition-colors">
                    Back
                </button>
                <button id="btn-next" class="px-6 py-2 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700 shadow-sm transition-colors">
                    Start
                </button>
            </div>
        </div>

    </main>

    <script>
        // --- State Management ---
        let currentPhase = 0;
        const totalPhases = 5;
        let scheduleTimeouts = [];

        // --- Utility Functions ---
        const clearSchedules = () => {
            scheduleTimeouts.forEach(clearTimeout);
            scheduleTimeouts = [];
        };

        const schedule = (fn, delay) => {
            scheduleTimeouts.push(setTimeout(fn, delay));
        };

        const updateDots = (phase) => {
            for(let i=1; i<=totalPhases; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i <= phase) {
                    dot.classList.remove('bg-slate-300');
                    dot.classList.add('bg-blue-600');
                } else {
                    dot.classList.add('bg-slate-300');
                    dot.classList.remove('bg-blue-600');
                }
            }
        };

        const setPanelHtml = (html) => {
            const panel = document.getElementById('panel-content');
            panel.innerHTML = html;
        };

        // --- Phase Definitions ---
        const phases = {
            0: { // Welcome
                enter: () => {
                    setPanelHtml(`
                        <div class="flex flex-col h-full justify-center">
                            <h2 class="text-2xl font-bold text-slate-800 mb-4">Kirchhoff's Laws</h2>
                            <p class="text-slate-600 mb-4">Welcome! In this interactive guide, we will analyze a two-loop electrical circuit using Kirchhoff's Current and Voltage laws.</p>
                            <p class="text-slate-600">Click <strong>Start</strong> to begin drawing the circuit.</p>
                        </div>
                    `);
                    document.getElementById('btn-next').innerText = "Start";
                    document.getElementById('btn-prev').disabled = true;
                    
                    // Reset SVG
                    document.querySelectorAll('.wire-draw').forEach(w => w.classList.remove('wire-drawn'));
                    document.getElementById('components').classList.remove('opacity-100');
                    document.getElementById('nodes').classList.remove('opacity-100');
                }
            },
            1: { // Draw Circuit
                enter: () => {
                    document.getElementById('btn-next').innerText = "Next";
                    document.getElementById('btn-prev').disabled = false;
                    
                    setPanelHtml(`
                        <h2 class="text-xl font-bold text-slate-800 mb-3">Phase 1: The Circuit</h2>
                        <p class="text-slate-600 mb-4">Here is our standard two-loop circuit configuration.</p>
                        <ul class="space-y-2 text-sm text-slate-700 mb-4">
                            <li class="flex items-center gap-2"><div class="w-3 h-3 bg-slate-800 rounded-sm"></div> <strong>Left Branch:</strong> Battery 1 (ε₁ = 4.5V) with internal resistance rw₁, and external resistor R₁ = 20Ω.</li>
                            <li class="flex items-center gap-2"><div class="w-3 h-3 bg-slate-800 rounded-sm"></div> <strong>Right Branch:</strong> Battery 2 (ε₂ = 9V) and its internal resistance rw₂ = 1Ω.</li>
                            <li class="flex items-center gap-2"><div class="w-3 h-3 bg-slate-800 rounded-sm"></div> <strong>Middle Branch:</strong> Shared resistor R₂ = 10Ω.</li>
                        </ul>
                        <p class="text-slate-600">The branches connect at top <strong>Node A</strong> and bottom <strong>Node B</strong>.</p>
                    `);

                    // Animate SVG
                    setTimeout(() => {
                        document.querySelectorAll('.wire-draw').forEach(w => w.classList.add('wire-drawn'));
                    }, 50);
                    setTimeout(() => {
                        document.getElementById('components').classList.add('opacity-100');
                        document.getElementById('nodes').classList.add('opacity-100');
                    }, 1000);

                    // Ensure next phase items are hidden
                    document.querySelectorAll('.flow-line').forEach(el => el.classList.remove('flow-visible'));
                    document.getElementById('static-arrows').classList.remove('opacity-100');
                }
            },
            2: { // Assumed Currents
                enter: () => {
                    setPanelHtml(`
                        <h2 class="text-xl font-bold text-slate-800 mb-3">Phase 2: Assign Currents</h2>
                        <p class="text-slate-600 mb-4">The first step in circuit analysis is to assign arbitrary current directions for each branch.</p>
                        <div class="space-y-3 bg-slate-50 p-4 rounded-lg border border-slate-200">
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-red-500 w-6">I₁</span>
                                <span class="text-sm">Assumed flowing UP the left branch.</span>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-green-500 w-6">I₂</span>
                                <span class="text-sm">Assumed flowing UP the right branch.</span>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-purple-500 w-6">I₃</span>
                                <span class="text-sm">Assumed flowing DOWN the middle.</span>
                            </div>
                        </div>
                        <p class="text-sm text-slate-500 italic mt-4">Note: If we guess wrong, the math will naturally yield a negative value at the end.</p>
                    `);

                    // Show currents
                    document.querySelectorAll('.flow-line').forEach(el => el.classList.add('flow-visible'));
                    document.getElementById('static-arrows').classList.add('opacity-100');
                    document.getElementById('node-a').classList.remove('node-glow'); // Reset from phase 3
                }
            },
            3: { // KCL
                enter: () => {
                    setPanelHtml(`
                        <h2 class="text-xl font-bold text-slate-800 mb-3">Phase 3: Kirchhoff's Current Law</h2>
                        <p class="text-slate-600 mb-4">KCL states that the sum of currents entering a junction must equal the sum of currents leaving it.</p>
                        <p class="text-slate-600 mb-4">Focus on the glowing <strong>Node A</strong>.</p>
                        
                        <div class="opacity-0 transition-opacity duration-1000" id="kcl-eq-box">
                            <ul class="text-sm mb-3">
                                <li>Entering: <span class="text-red-500 font-bold">I₁</span> and <span class="text-green-500 font-bold">I₂</span></li>
                                <li>Leaving: <span class="text-purple-500 font-bold">I₃</span></li>
                            </ul>
                            <div class="math-font text-center text-xl font-bold p-3 bg-blue-50 text-blue-900 rounded border border-blue-200 shadow-sm">
                                <span class="text-red-500">I₁</span> + <span class="text-green-500">I₂</span> = <span class="text-purple-500">I₃</span>
                            </div>
                            <p class="text-xs text-right mt-1 text-slate-500">Equation (1)</p>
                        </div>
                    `);

                    document.getElementById('node-a').classList.add('node-glow');
                    document.getElementById('loop1-glow').classList.remove('animate-loop-glow'); // Reset phase 4

                    schedule(() => {
                        const eqBox = document.getElementById('kcl-eq-box');
                        if(eqBox) eqBox.classList.add('opacity-100');
                    }, 800);
                }
            },
            4: { // KVL Tracing
                enter: () => {
                    setPanelHtml(`
                        <h2 class="text-xl font-bold text-slate-800 mb-3">Phase 4: Kirchhoff's Voltage Law</h2>
                        <p class="text-sm text-slate-600 mb-4">KVL states the sum of voltage changes around a closed loop is zero.</p>
                        
                        <!-- Loop 1 Container -->
                        <div class="mb-4">
                            <h3 class="font-bold text-slate-700 text-sm mb-1" id="l1-title">Loop 1 (Left, Clockwise)</h3>
                            <div class="math-font text-sm bg-slate-50 p-2 rounded border border-slate-200 min-h-[40px] flex items-center flex-wrap gap-1" id="l1-eq"></div>
                            <div class="math-font text-sm font-bold text-blue-800 mt-1 hidden" id="l1-simp">=> 4.5 - 21I₁ - 10I₃ = 0 <span class="text-xs text-slate-400 float-right font-normal">(Eq 2)</span></div>
                        </div>

                        <!-- Loop 2 Container -->
                        <div class="opacity-0 transition-opacity duration-500" id="l2-container">
                            <h3 class="font-bold text-slate-700 text-sm mb-1">Loop 2 (Right, Clockwise)</h3>
                            <div class="math-font text-sm bg-slate-50 p-2 rounded border border-slate-200 min-h-[40px] flex items-center flex-wrap gap-1" id="l2-eq"></div>
                            <div class="math-font text-sm font-bold text-green-800 mt-1 hidden" id="l2-simp">=> 10I₃ + I₂ - 9 = 0 <span class="text-xs text-slate-400 float-right font-normal">(Eq 3)</span></div>
                        </div>
                    `);

                    document.getElementById('node-a').classList.remove('node-glow');
                    
                    // Sequence Variables
                    const l1eq = document.getElementById('l1-eq');
                    const l2eq = document.getElementById('l2-eq');

                    // --- Loop 1 Sequence ---
                    schedule(() => { document.getElementById('loop1-glow').classList.add('animate-loop-glow'); }, 100);
                    
                    // Term 1: Battery (+4.5)
                    schedule(() => { l1eq.innerHTML += '<span class="text-blue-600 fade-enter fade-enter-active">+4.5V</span>'; }, 800);
                    // Term 2: rw1 (- 1 I1)
                    schedule(() => { l1eq.innerHTML += '<span class="text-red-600 fade-enter fade-enter-active">- 1Ω·I₁</span>'; }, 1800);
                    // Term 3: R1 (- 20 I1)
                    schedule(() => { l1eq.innerHTML += '<span class="text-red-600 fade-enter fade-enter-active">- 20Ω·I₁</span>'; }, 2600);
                    // Term 4: R2 (- 10 I3)
                    schedule(() => { l1eq.innerHTML += '<span class="text-purple-600 fade-enter fade-enter-active">- 10Ω·I₃</span>'; }, 3400);
                    // End
                    schedule(() => { l1eq.innerHTML += '<span class="fade-enter fade-enter-active">= 0</span>'; }, 3800);
                    schedule(() => { document.getElementById('l1-simp').classList.remove('hidden'); }, 4400);

                    // --- Transition to Loop 2 ---
                    schedule(() => { 
                        document.getElementById('loop1-glow').classList.remove('animate-loop-glow'); 
                        document.getElementById('l2-container').classList.add('opacity-100');
                        document.getElementById('loop2-glow').classList.add('animate-loop-glow');
                    }, 5500);

                    // --- Loop 2 Sequence ---
                    // Term 1: up R2 against I3 (+ 10 I3)
                    schedule(() => { l2eq.innerHTML += '<span class="text-purple-600 fade-enter fade-enter-active">+ 10Ω·I₃</span>'; }, 6300);
                    // Term 2: down rw2 against I2 (+ 1 I2)
                    schedule(() => { l2eq.innerHTML += '<span class="text-green-600 fade-enter fade-enter-active">+ 1Ω·I₂</span>'; }, 7500);
                    // Term 3: through bat 2 from + to - (- 9)
                    schedule(() => { l2eq.innerHTML += '<span class="text-blue-600 fade-enter fade-enter-active">- 9V</span>'; }, 8300);
                    // End
                    schedule(() => { l2eq.innerHTML += '<span class="fade-enter fade-enter-active">= 0</span>'; }, 8800);
                    schedule(() => { document.getElementById('l2-simp').classList.remove('hidden'); }, 9400);
                },
                leave: () => {
                    document.getElementById('loop1-glow').classList.remove('animate-loop-glow');
                    document.getElementById('loop2-glow').classList.remove('animate-loop-glow');
                }
            },
            5: { // Solving
                enter: () => {
                    document.getElementById('btn-next').disabled = true;

                    setPanelHtml(`
                        <h2 class="text-xl font-bold text-slate-800 mb-2">Phase 5: Solving</h2>
                        
                        <div class="math-font text-xs bg-slate-800 text-slate-300 p-3 rounded mb-3">
                            <div>(1) I₁ + I₂ = I₃</div>
                            <div>(2) 4.5 - 21I₁ - 10I₃ = 0</div>
                            <div>(3) 10I₃ + I₂ - 9 = 0</div>
                        </div>

                        <div id="math-steps" class="math-font text-sm space-y-2 mb-4 min-h-[160px]">
                            <!-- Steps injected here -->
                        </div>

                        <div id="final-insight" class="opacity-0 transition-opacity duration-1000 bg-amber-50 border border-amber-200 p-3 rounded text-sm text-amber-900 shadow-sm">
                            <strong class="text-red-600">Insight:</strong> I₁ is negative! This means our initial assumption was wrong; the actual current flows <strong>DOWN</strong> the left branch, charging battery 1.
                        </div>
                    `);

                    const stepsContainer = document.getElementById('math-steps');
                    
                    const steps = [
                        `<div class="text-slate-500">From (3): <span class="text-slate-800">I₂ = 9 - 10I₃</span></div>`,
                        `<div class="text-slate-500">Sub into (1): I₁ + (9 - 10I₃) = I₃ → <span class="text-slate-800">I₁ = 11I₃ - 9</span></div>`,
                        `<div class="text-slate-500">Sub into (2): 4.5 - 21(11I₃ - 9) - 10I₃ = 0</div>`,
                        `<div class="text-slate-500">4.5 - 231I₃ + 189 - 10I₃ = 0 → 241I₃ = 193.5</div>`,
                        `<div class="font-bold text-purple-700 mt-2 bg-purple-50 inline-block px-2 py-1 rounded">I₃ ≈ 0.80 A</div>`,
                        `<div class="font-bold text-red-700 mt-1 bg-red-50 inline-block px-2 py-1 rounded">I₁ = 11(0.80) - 9 ≈ -0.17 A</div>`,
                        `<div class="font-bold text-green-700 mt-1 bg-green-50 inline-block px-2 py-1 rounded">I₂ = 9 - 10(0.80) ≈ 0.97 A</div>`
                    ];

                    steps.forEach((stepHtml, index) => {
                        schedule(() => {
                            const div = document.createElement('div');
                            div.innerHTML = stepHtml;
                            div.className = 'fade-enter fade-enter-active';
                            stepsContainer.appendChild(div);
                            stepsContainer.scrollTop = stepsContainer.scrollHeight;
                        }, index * 800);
                    });

                    schedule(() => {
                        document.getElementById('final-insight').classList.add('opacity-100');
                    }, steps.length * 800 + 500);
                }
            }
        };

        // --- Controller ---
        const goToPhase = (n) => {
            if (n < 0 || n > totalPhases) return;
            
            // Clean up previous phase
            clearSchedules();
            if (phases[currentPhase] && phases[currentPhase].leave) {
                phases[currentPhase].leave();
            }

            currentPhase = n;
            updateDots(currentPhase);
            
            document.getElementById('btn-next').disabled = false;
            
            // Enter new phase
            phases[currentPhase].enter();
        };

        // --- Event Listeners ---
        document.getElementById('btn-next').addEventListener('click', () => {
            goToPhase(currentPhase + 1);
        });

        document.getElementById('btn-prev').addEventListener('click', () => {
            goToPhase(currentPhase - 1);
        });

        // Init
        goToPhase(0);

    </script>
</body>
</html>
